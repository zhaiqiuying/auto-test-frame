schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 项目背景
  auto-test-frame 是一套 Java 8 / Maven 多模块的接口自动化测试框架，纯公共依赖，可直接 `mvn -B clean test` 构建。

  - btest（框架层）：TestNG 引擎扩展（Retry 重试、DataProvider 数据驱动、Listener）、DB 抽象（DataSourceFactory + Druid）、断言（AssertUtil）、监控通知
  - itest（接口测试层）：BaseCase 用例基类、CommonService 请求封装、User/Env/App/Device 上下文模型
  - 包名统一 `com.example.qa.{btest,itest}`，Maven groupId 为 `com.example.qa.auto-test`
  - 父 POM 为 spring-boot-starter-parent 2.7.5；TestNG 7.1.0；Java 8
  - 资源按 `/{ENV_TYPE}/` 环境目录组织（cases/config/data），ENV_TYPE 由系统属性注入
  - 用例扩展方式：继承 itest 的 BaseCase → service 封装请求 → AssertUtil 断言；suite 参数以 `execute_*` 前缀注入

  ## 设计约定
  - 新增框架能力优先做成「注解 + 注册表」形式，用例侧零侵入
  - 涉及框架行为改动时，同步更新 README 对应章节
  - 每份 change 的 tasks 必须包含构建验证步骤（`mvn -B clean test`）

  ## 编码后自检清单
  每个 task 实现完成后、标记 `[x]` 前，对照以下检查清单逐项确认。
  清单来源于 code-review 评审规则（`.codebuddy/skills/code-review/references/`）。
  阿里手册和 coding-standards.md 已覆盖的确定性规则不再重复列出，仅列出需要语义判断的检查项。

  ### 高风险项（必须自检通过）
  - [ ] 死代码：无逻辑分支中的不可达代码（编译器能检测的不算）、无大段注释代码（PMD 已覆盖的不算）
  - [ ] 逻辑错误：if 条件逻辑正确、边界检查无误、无死循环/递归
  - [ ] NPE 风险：调用链返回值使用前判空（需跨文件确认数据来源是否可能为 null）
  - [ ] 异常处理：RuntimeException 附加上下文消息、finally 块不抛异常掩盖原始异常

  ### 中风险项（建议自检）
  - [ ] 性能：循环内无数据库查询（需确认方法调用链）、无 N+1 查询、大数据集有分页
  - [ ] 并发安全：check-then-act 有同步、DCL 字段有 volatile（需确认调用上下文是否多线程）
  - [ ] SOLID 原则：单一职责、开闭原则、接口契约一致
  - [ ] 测试覆盖：核心逻辑有测试、边界场景有覆盖、测试可独立运行

  > 阿里手册和 coding-standards.md 已覆盖的确定性规则（switch break、返回空集合、
  > PreparedStatement、ConcurrentHashMap、e.printStackTrace、硬编码凭据、类型强转 instanceof、
  > 日志 @Slf4j 等）编码时遵循即可，此处不重复列出。

rules:
  tasks:
    - 任务粒度控制在一小时内可完成
    - 至少包含一条构建验证任务
