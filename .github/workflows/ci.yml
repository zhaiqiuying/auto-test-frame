name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────
  # Layer 1-A: 编译 + 单元测试（必须通过）
  # ──────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Compile + Test
        run: mvn -B clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/

  # ──────────────────────────────────────────────
  # Layer 1-B: 静态分析（并行，-Pci 激活门禁）
  # ──────────────────────────────────────────────
  spotbugs:
    name: SpotBugs (High)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: SpotBugs Check
        run: mvn -B -Pci -q compile spotbugs:check

  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: PMD Check
        run: mvn -B -Pci -q compile pmd:check

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle Check
        run: mvn -B -Pci -q compile checkstyle:check

  # ──────────────────────────────────────────────
  # Gate: 所有检查通过才允许合并
  # ──────────────────────────────────────────────
  gate:
    name: Gate (all checks pass)
    runs-on: ubuntu-latest
    needs: [ build-test, spotbugs, pmd, checkstyle ]
    steps:
      - name: Gate passed
        run: |
          echo "✅ All Layer 1 checks passed"
          echo "  - Build & Test: OK"
          echo "  - SpotBugs (High): OK"
          echo "  - PMD: OK"
          echo "  - Checkstyle: OK"
