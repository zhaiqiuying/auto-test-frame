name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────
  # Layer 1: 编译 + 测试 + 静态分析（一条命令完成）
  # mvn verify 走完整 Maven 生命周期，模块间依赖在 reactor 内解析，
  # 不需要 install jar 到本地仓库
  # ──────────────────────────────────────────────
  build-test:
    name: Build, Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Compile + Test + SpotBugs + PMD + Checkstyle
        run: mvn -B -Pci clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/spotbugs/*.xml
            **/target/site/
